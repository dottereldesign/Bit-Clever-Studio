<!doctype html><html><head><meta charset="UTF-8"><title>Grid return automated check</title></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import App from '/src/App.tsx';
import '/src/style.css';

const image = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#dce5d3"/></svg>');
const library = {
  items: Array.from({ length: 420 }, (_, n) => ({ id: n + 1, name: `Reference ${String(n + 1).padStart(4, '0')}`, path: `C:/mock/${n + 1}.png`, kind: 'image', source: 'Design', modified: 1, added: n + 1, missing: false, category: 'Poster', tags: [1], projects: [7], favourites: [] })),
  projects: [{ id: 7, name: 'Example project', count: 420 }], tags: [{ id: 1, name: 'School', count: 420 }], sources: ['Design', 'Photography', 'Videos'], root: 'C:/mock', scanning: false,
};
let callbackId = 0;
window.isTauri = true;
window.__TAURI_INTERNALS__ = {
  transformCallback: () => ++callbackId,
  convertFileSrc: () => image,
  invoke: async (command) => {
    if (command === 'get_library') return library;
    if (command === 'get_media') return 'mock.png';
    if (command.startsWith('plugin:event|')) return ++callbackId;
    throw Error(`Unexpected command: ${command}`);
  },
};
window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
createRoot(document.getElementById('root')).render(React.createElement(React.StrictMode, null, React.createElement(App,{startOnHome:false})));
const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
async function until(test, label) {
  const start = performance.now();
  while (!test()) { if (performance.now() - start > 4000) throw Error(`Timed out: ${label}`); await pause(16); }
}
function assert(value, label) { if (!value) throw Error(label); }
const viewer = () => document.querySelector('.viewer');
function key(value) { document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: value, bubbles: true })); }
const checks = [];
let resizeId = 0;
async function resize(width) {
  window.__resizeAction = { id: ++resizeId, width };
  await until(() => window.__resizeActionDone === resizeId && innerWidth === width, 'resize window');
  await pause(150);
}
try {
  const originalWidth = innerWidth;
  await until(() => document.querySelector('.card-open'), 'library render');
  await pause(150);
  [...document.querySelectorAll('nav[aria-label=Library] button')].find(b=>b.querySelector('span')?.textContent==='Recently added').click();await pause(200);
  document.querySelector('.recent-reference').click();
  await until(() => viewer(), 'viewer opens');
  assert(viewer().classList.contains('viewer-docked') === (originalWidth >= 1600), 'Initial breakpoint');
  await resize(3440);
  await until(() => viewer()?.classList.contains('viewer-docked'), 'dock viewer');
  const main = document.querySelector('main'), sidebar = document.querySelector('.sidebar');
  assert(!main.inert && !sidebar.inert, 'Library remains interactive');
  assert(viewer().getAttribute('role') === 'region' && !viewer().hasAttribute('aria-modal'), 'Nonmodal preview semantics');
  const shell = document.querySelector('.preview-shell-docked');
  const entrance = shell.getAnimations()[0];
  assert(entrance?.animationName === 'preview-slide-in', 'Drawer has slide entrance');
  await entrance.finished;
  window.__screenshotReady = true;
  await pause(200);
  const rect = viewer().getBoundingClientRect(), grid = main.getBoundingClientRect();
  assert(rect.left >= grid.right - 1 && rect.right <= innerWidth && grid.width > 1000, 'Preview sits beside grid');
  assert(viewer().scrollWidth <= rect.width, 'Preview toolbar fits');
  if (originalWidth >= 1600) assert(document.activeElement !== viewer(), 'Dock does not steal thumbnail focus');
  const other = [...document.querySelectorAll('.recent-reference')].find(button => button.dataset.itemId !== viewer().dataset.itemId);
  const otherId = other.dataset.itemId;
  other.click();
  await until(() => viewer()?.dataset.itemId === otherId, 'switch preview by clicking grid');
  assert(document.querySelector('.preview-shell-docked') === shell, 'Switch keeps the same drawer');
  assert(shell.getAnimations()[0] === entrance && entrance.playState === 'finished', 'Switch does not replay entrance');
  checks.push('Right slide opens once; choosing another thumbnail preserves the settled glass drawer');
  checks.push('Ultrawide layout, interactive library, click-to-switch');
  const content = document.querySelector('.content');
  content.scrollTop = 1800;
  await pause(150);
  assert(content.scrollTop > 1000 && viewer().dataset.itemId === otherId, 'Grid scroll independent of preview');
  const id = viewer().dataset.itemId;
  await resize(1599);
  await until(() => !viewer().classList.contains('viewer-docked') && main.inert, 'resize to overlay');
  assert(viewer().dataset.itemId === id && viewer().getAttribute('aria-modal') === 'true', 'Resize retains item in modal');
  await resize(1600);
  await until(() => viewer().classList.contains('viewer-docked') && !main.inert, 'resize back to dock');
  assert(viewer().dataset.itemId === id, 'Resize back retains item');
  checks.push('Grid scrolls independently; 1599/1600 boundary switches without losing item');
  key('ArrowRight');
  await until(() => viewer()?.dataset.itemId !== id, 'arrow navigation');
  const beforeClose = content.scrollTop;
  document.querySelector('.viewer [aria-label="Close viewer"]').click();
  await until(() => !viewer(), 'close dock');
  await pause(150);
  assert(Math.abs(content.scrollTop - beforeClose) < 3, 'Closing dock preserves browsing position');
  document.querySelector('.recent-reference').click();
  await until(() => viewer(), 'reopen dock');
  const search = document.querySelector('[aria-label="Search library"]');
  document.body.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true,bubbles:true,cancelable:true}));await until(()=>document.activeElement===search,'Search shortcut focuses field');
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(search, 'Reference 0001');
  search.dispatchEvent(new Event('input', { bubbles: true }));
  await until(() => !viewer(), 'filter closes excluded preview');
  assert(document.activeElement === search, 'Search retains focus');
  checks.push('Arrow navigation, close preserves scroll, search remains usable and clears excluded preview');
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(search, '');
  search.dispatchEvent(new Event('input', { bubbles: true }));
  [...document.querySelectorAll('.sidebar button')].find(button => button.textContent.includes('Poster')).click();
  await until(() => document.querySelector('.poster-masonry .card img'), 'poster masonry');
  async function checkMasonry() {
    await pause(350);
    const cards = [...document.querySelectorAll('.poster-masonry .card')];
    assert(cards.length > 2, 'Masonry has measurable cards');
    const bounds = cards.map(card => card.getBoundingClientRect());
    for (let a = 0; a < bounds.length; a++) for (let b = a + 1; b < bounds.length; b++) {
      const x = bounds[a], y = bounds[b];
      assert(!(x.left < y.right - 1 && x.right > y.left + 1 && x.top < y.bottom - 1 && x.bottom > y.top + 1), `Masonry overlap at width ${innerWidth}, dock ${!!viewer()}: ${JSON.stringify([x.toJSON(), y.toJSON()])}`);
    }
  }
  await checkMasonry();
  for (const width of [1920, 3440, 1600]) {
    await resize(width);
    document.querySelector('.poster-masonry .card-open').click();document.querySelector('.poster-masonry .card-open').focus();key(' ');
    await until(() => document.querySelector('.quick-preview'), 'poster quick preview');
    await checkMasonry();
    key('Escape');
    await until(() => !document.querySelector('.quick-preview'), 'close poster preview');
    await checkMasonry();
  }
  checks.push('Poster masonry has no overlaps when Space preview opens, closes or changes width');
  document.getElementById('check-result').textContent = JSON.stringify({ ok: true, checks, width: originalWidth });
} catch (error) {
  document.getElementById('check-result').textContent = JSON.stringify({ ok: false, error: String(error), stack:error.stack, checks });
}
</script></body></html>
