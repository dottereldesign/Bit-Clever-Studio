<!doctype html><html><head><meta charset="UTF-8"><title>Grid return automated check</title></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import App from '/src/App.tsx';
import '/src/style.css';

const image = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#dce5d3"/></svg>');
const library = {
  items: Array.from({ length: 420 }, (_, n) => ({ id: n + 1, name: `Reference ${String(n + 1).padStart(4, '0')}`, path: `C:/mock/${n + 1}.png`, kind: 'image', source: 'Design', modified: 1, added: n + 1, missing: false, tags: [1], projects: [7], favourites: [] })),
  projects: [{ id: 7, name: 'Example project', count: 420 }], tags: [{ id: 1, name: 'School', count: 420 }], sources: ['Design', 'Photography', 'Videos'], root: 'C:/mock', scanning: false,
};
let callbackId = 0;
window.isTauri = true;
window.__TAURI_INTERNALS__ = {
  transformCallback: () => ++callbackId,
  convertFileSrc: () => image,
  invoke: async (command) => {
    if (command === 'get_library') return library;
    if (command === 'get_media') return 'mock.png';
    if (command.startsWith('plugin:event|')) return ++callbackId;
    throw Error(`Unexpected command: ${command}`);
  },
};
window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
createRoot(document.getElementById('root')).render(React.createElement(React.StrictMode, null, React.createElement(App,{startOnHome:false})));
const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
async function until(test, label) {
  const start = performance.now();
  while (!test()) { if (performance.now() - start > 4000) throw Error(`Timed out: ${label}`); await pause(16); }
}
function assert(value, label) { if (!value) throw Error(label); }
const preview = () => document.querySelector('.quick-preview');
function key(value) { document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true })); }
const name = id => `Reference ${String(id).padStart(4, '0')}`;
async function advance(count, direction = 'ArrowRight') {
  for (let n=0;n<count;n++) {
    const before=preview()?.querySelector('header strong').textContent;
    key(direction);
    await until(()=>preview()?.querySelector('header strong').textContent!==before,'Advance preview');
  }
}
const checks=[];
try {
  await until(()=>document.querySelector('.card-open'),'Gallery render');
  const content=document.querySelector('.content');
  const open=async()=>{const button=document.querySelector('.card-open');button.click();button.focus();await pause(30);assert(button.closest('.card').classList.contains('selected'),'Click did not select');assert(!document.querySelector('.viewer'),'Click opened full viewer');key(' ');await until(()=>preview(),'Space preview');return button;};
  const origin=await open(), scroll=content.scrollTop;
  await advance(200);
  assert(preview().querySelector('header strong').textContent===name(220),'Wrong item after 200 advances');
  key('Escape');await until(()=>!preview()&&document.activeElement===origin,'Escape restores origin focus');
  assert(content.scrollTop===scroll,'Preview changed gallery scroll');
  checks.push('Gallery click selects; 200 Space-preview advances; Escape restores originating focus and scroll');
  key(' ');await until(()=>preview(),'Reopen focused reference');
  document.querySelector('[aria-label="Close quick preview"]').click();await until(()=>!preview()&&document.activeElement===origin,'Close button restores focus');
  const search=document.querySelector('[aria-label="Search library"]');
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(search,'Reference 00');search.dispatchEvent(new Event('input',{bubbles:true}));
  const sort=document.querySelector('[aria-label="Sort items"]');sort.value='name';sort.dispatchEvent(new Event('change',{bubbles:true}));
  await until(()=>document.querySelector('.card')?.dataset.itemId==='1','Filtered name order');
  const filteredOrigin=await open();await advance(98);
  assert(preview().querySelector('header strong').textContent===name(99),'Filtered preview order');
  await advance(1);assert(preview().querySelector('header strong').textContent===name(1),'Forward wrap');
  await advance(1,'ArrowLeft');assert(preview().querySelector('header strong').textContent===name(99),'Backward wrap');
  key(' ');await until(()=>!preview()&&document.activeElement===filteredOrigin,'Space closes and restores focus');
  assert(search.value==='Reference 00'&&sort.value==='name','Search or sort lost');
  checks.push('Close button and Space return focus; filtered name order, bidirectional wrap and selection remain intact');
  document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks,width:innerWidth});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error),stack:error.stack,checks});}
</script></body></html>
