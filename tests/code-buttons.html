assert(!calls.includes('update')&&!calls.includes('open_external_url'),'Demo changed library or opened a website');await until(()=>readViewSession()?.view.studioView?.section==='code');assert(document.querySelector('.code-library').scrollWidth<=document.querySelector('.code-library').clientWidth+1,'Gallery overflows horizontally');document.activeElement.blur();window.__screenshotReady=true;await pause(1200);
document.querySelector('[aria-label="Go to Home"]').click();await until(()=>document.querySelector('.home-dashboard'));folder.click();await until(()=>document.querySelector('.code-library'));document.documentElement.dataset.motion='reduce';assert(getComputedStyle(document.querySelector('.code-demo')).transitionDuration==='0s','Reduced motion');

setInput(document.querySelector('[aria-label="Code columns"]'),'1');await until(()=>document.querySelector('.code-library-toolbar output').textContent==='1');all.click();await pause(50);assert(document.querySelector('[aria-label="Code columns"]').value==='2','Columns leaked to All Components');folder.click();await pause(50);assert(document.querySelector('[aria-label="Code columns"]').value==='1','Folder columns forgotten');
