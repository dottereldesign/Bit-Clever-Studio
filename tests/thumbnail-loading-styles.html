<!doctype html><html><head><meta charset="UTF-8"><title>Thumbnail loading style comparisons</title></head><body><div id="root"></div><pre id="check-result" hidden>pending</pre><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import ThumbnailProgress from '/src/ThumbnailProgress.tsx';import{mediaQueue}from'/src/api.ts';import '/src/style.css';
createRoot(document.getElementById('root')).render(React.createElement('header',{className:'topbar'},React.createElement('div',{className:'view-title'},React.createElement('h1',null,'Design Inspo')),React.createElement('div',{className:'header-actions'},React.createElement(ThumbnailProgress,{title:'Design Inspo'}))));
const pause=ms=>new Promise(r=>setTimeout(r,ms));const until=async f=>{for(let n=0;n<150;n++){if(f())return;await pause(30);}throw Error('Timed out waiting for interaction');};const assert=(x,m)=>{if(!x)throw Error(m);};let seq=0;async function key(key,shift=false){const id=++seq;window.__keyAction={id,key,shift};await until(()=>window.__keyActionDone===id);await pause(40);}
try{
 await until(()=>document.querySelector('.tl-style-trigger'));const trigger=document.querySelector('.tl-style-trigger');trigger.focus();trigger.click();await until(()=>document.querySelector('dialog[open]'));
 const options=[...document.querySelectorAll('.tl-option')];assert(options.length===10,'Expected ten choices');
 for(const option of options){option.click();await pause(30);assert(option.getAttribute('aria-pressed')==='true','Choice not selected');assert(document.querySelectorAll('.tl-option[aria-pressed="true"]').length===1,'Multiple selected styles');const box=option.querySelector('.tl-sample-header');assert(box.scrollWidth<=box.clientWidth+1,'Preview overflows');assert(option.querySelector('.tl-option-caption').getBoundingClientRect().bottom<=option.getBoundingClientRect().bottom+1,'Option caption clipped');}
 const range=document.querySelector('#tl-sample');const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;setter.call(range,'80');range.dispatchEvent(new Event('input',{bubbles:true}));range.dispatchEvent(new Event('change',{bubbles:true}));await pause(40);assert(document.querySelector('.tl-option [role="progressbar"]').getAttribute('aria-valuenow')==='80','Sample range not reflected');
 const dialog=document.querySelector('dialog');const footer=document.querySelector('.tl-picker-footer button');footer.focus();await key('Tab');assert(dialog.contains(document.activeElement),'Focus escaped modal');
 const bounds=footer.getBoundingClientRect();assert(bounds.bottom<=innerHeight&&bounds.top>=0,'Footer unreachable');assert(dialog.scrollWidth<=dialog.clientWidth+1,'Dialog horizontal overflow');
 window.__screenshotReady=true;await pause(350);
 await key('Escape');await until(()=>!document.querySelector('dialog'));assert(document.activeElement===trigger,'Opener focus not restored');assert(document.querySelector('.tl-header-control [role="progressbar"]').getAttribute('aria-valuenow')==='80','Header preview lost chosen progress');
 document.querySelector('.tl-preview-stop').click();await pause(40);assert(!document.querySelector('.tl-header-control [role="progressbar"]'),'Sample did not stop');
 let finish;const work=mediaQueue.request('fixture',true,()=>new Promise(resolve=>finish=resolve));await until(()=>document.querySelector('.tl-header-control [role="progressbar"]'));assert(document.querySelector('[role="progressbar"]').getAttribute('aria-valuenow')==='0','Live progress replaced by sample');finish('ok');await work;await until(()=>!document.querySelector('[role="progressbar"]'));
 document.getElementById('check-result').textContent=JSON.stringify({ok:true,checks:['Ten contextual header styles and exclusive selection','Adjustable sample reaches real header','Modal keyboard containment, Escape and focus restoration','Small-window bounds and reachable footer','Preview stops; real queue progress retains delayed visibility']});
}catch(error){document.getElementById('check-result').textContent=JSON.stringify({ok:false,error:String(error)});}
</script></body></html>
